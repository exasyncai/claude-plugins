name: Bug report
description: Something does not work as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - email-format-guard
        - decision-precedent
        - usage-guard
        - marketplace (install or manifest)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version and Claude Code version
      placeholder: "0.1.0, claude 2.1.x"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact command or prompt, and the input file if any.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Paste the output. Remove anything confidential first.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Python version
      placeholder: "Windows 11, Python 3.11"
