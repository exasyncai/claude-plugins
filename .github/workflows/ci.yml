name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  tests:
    name: Plugin tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet pytest
      - run: python -m pytest plugins -q

  manifests:
    name: Manifest sanity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Parse marketplace and plugin manifests, check sources exist
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          root = pathlib.Path(".")
          mp = json.loads((root / ".claude-plugin" / "marketplace.json").read_text(encoding="utf-8"))
          bad = 0
          for p in mp["plugins"]:
              src = root / p["source"]
              pj = src / ".claude-plugin" / "plugin.json"
              if not pj.is_file():
                  print("missing", pj); bad += 1; continue
              meta = json.loads(pj.read_text(encoding="utf-8"))
              if meta["name"] != p["name"]:
                  print("name mismatch", p["name"], meta["name"]); bad += 1
              print("ok", p["name"], meta["version"])
          sys.exit(1 if bad else 0)
          EOF

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          TAG=$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | python3 -c 'import sys,json;print(json.load(sys.stdin)["tag_name"])')
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/${TAG}/gitleaks_${TAG#v}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan full history
        run: /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1
      - name: Scan working tree
        run: /tmp/gitleaks detect --source . --no-git --redact --no-banner --exit-code 1
